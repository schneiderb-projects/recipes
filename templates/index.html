<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maddie's Recipes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>Maddie's Recipes</h1>
            <div class="header-controls">
                <div class="tag-filter">
                    <select id="tagFilter">
                        <option value="">All Recipes</option>
                    </select>
                </div>
                <button class="shopping-list-button">Shopping List</button>
                <button class="add-recipe-button">Add Recipe</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="recipe-grid">
            <!-- Recipe cards will be added here -->
        </div>
    </div>

    <!-- Recipe Modal -->
    <div class="modal" id="recipeModal" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="modalTitle" class="modal-title"></h2>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modalImage" class="modal-image" alt="">
                </div>
                <div class="modal-content-sections">
                    <section class="modal-section">
                        <h3>Ingredients</h3>
                        <ul id="ingredientsList"></ul>
                    </section>
                    <section class="modal-section">
                        <h3>Instructions</h3>
                        <div id="instructionsContent"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Recipe Modal -->
    <div class="modal" id="addRecipeModal" role="dialog" aria-labelledby="addRecipeTitle" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="addRecipeTitle" class="modal-title">Add New Recipe</h2>
            <form id="addRecipeForm" class="recipe-form">
                <div class="form-group">
                    <label for="recipeTitle">Title</label>
                    <input type="text" id="recipeTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="recipeImage">Image URL</label>
                    <input type="url" id="recipeImage" name="image" required>
                    <p class="help-text">Find beautiful food images at <a href="https://unsplash.com/t/food-drink" target="_blank">Unsplash Food & Drink</a></p>
                </div>
                <div class="form-group">
                    <label for="recipeDescription">Description</label>
                    <textarea id="recipeDescription" name="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeIngredients">Ingredients (one per line)</label>
                    <textarea id="recipeIngredients" name="ingredients" required></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeInstructions">Instructions</label>
                    <textarea id="recipeInstructions" name="instructions" required></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeTags">Tags</label>
                    <div class="tag-input-container">
                        <div id="selectedTags" class="selected-tags"></div>
                        <input type="text" id="recipeTags" placeholder="Type to add tags">
                        <div id="addRecipeTagAutocomplete" class="tag-autocomplete"></div>
                    </div>
                    <p class="help-text">Add tags to help categorize your recipes</p>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-button" aria-label="Cancel">Cancel</button>
                    <button type="submit" class="submit-button" aria-label="Add recipe">Add Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tag Management Modal -->
    <div class="modal" id="tagModal" role="dialog" aria-labelledby="tagModalTitle" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="tagModalTitle" class="modal-title"></h2>
            <div class="tag-management">
                <div class="current-tags">
                    <h3>Current Tags</h3>
                    <div id="currentTagsList" class="tags-list"></div>
                </div>
                <div class="add-tag">
                    <h3>Add New Tag</h3>
                    <div class="tag-input-group">
                        <input type="text" id="newTagInput" placeholder="Enter tag name">
                        <div id="tagAutocomplete" class="tag-autocomplete"></div>
                        <button id="addTagButton" class="add-tag-button">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Shopping List Modal -->
    <div id="shoppingListModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>Shopping List</h2>
            <div class="selected-recipes">
                <!-- Recipe names will be added here -->
            </div>
            <div id="shoppingListContent">
                <div class="ingredients-list">
                    <!-- Ingredients will be added here -->
                </div>
            </div>
        </div>
    </div>

    <noscript>
        <div class="no-js-message">
            <p>Please enable JavaScript to view the recipe gallery.</p>
        </div>
    </noscript>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
